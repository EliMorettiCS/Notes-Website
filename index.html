<html>
    <head>
        <link rel="stylesheet" href="main.css">
        <title>Satori Notes</title>
    </head>
    <body>
        <h1>Simple Notes</h1>
        <h2>APCSP Creative Project</h2>
        <hr>
        <div id="selectedNote">
                <textarea id="title" placeholder="Title" rows="1"></textarea>
                <textarea id="date" placeholder="Date" readonly rows="1"></textarea>
                <textarea id="contents" name="contents" placeholder="Type Your Note Here:" autofocus rows="5"></textarea>
                <button id="save">Save</button>
        </div>
        <div id="notes">
            <p>It seems you have been met with a terrible fate... (ERROR: No Notes To Display)</p>
        </div>
        <div id="options">
            <button><img src="plus-symbol.png" alt="plus symbol" width="30" id="newNote" title="Shortcut"></button>
            <button> <img src="delete-symbol.png"alt="delete symbol" width="30" id="deleteNote" title="Shortcut"></button>
            <!-- <button> <img src="clear-symbol.png"alt="clear symbol" width="30" id="clearNotes" title="Shortcut"></button> -->
            <button id="settings" title="Shortcut"><img src="settings-symbol.png"alt="settings symbol" width="30"></button>
            <!-- <button><img src="date-symbol.png" alt="date symbol" width="20"></button> -->
            <!-- <button><img src="sort-symbol.png" alt="sort symbol" width="20"></button> -->
            <!-- <button><img src="search-symbol.png" alt="search symbol" width="20"></button> -->
        </div>
        <div id="settingsPopup" class="popup">
            <div id="PopupContainer">
                <h1>Settings</h1>
                <hr>
                <h2>Accessibility</h2>
                <button id="highContrast">High Contrast</button>
                <button id="colorIndependance">Color Independance</button>
                <button id="animatedElements">Animated Elements</button>
                <h2>Visual</h2>
                <button id="color">Color</button>
                <button id="roundness">Roundness</button>
                <h2>Audio</h2>
                <button id="soundEffects">Sound Effects</button>
                <button id="backgroundMusic">Background Music</button>
                <hr>
                <div id="bottomOptions">
                    <button id="settingsExit">Exit</button>
                </div>
            </div>
        </div>
    <script src="main.js"></script>
    </body>
</html>
